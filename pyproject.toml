[project]
name = "afl-parity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.1",
    "numpy>=2.0",
    "pillow>=12.3.0",
    "requests>=2.32.3",
]

[project.scripts]
afl-parity = "afl_parity.main:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.9.9",
    "pytest>=8.3.5",
    "ty>=0.0.61",
]

[tool.pytest.ini_options]
addopts = "-p no:logging"
testpaths = ["tests"]
